<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>印章原型预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
  }
  .phone-frame {
    width:100%;
    max-width:375px;
    background:#fff;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }
  .status-bar {
    height:48px;
    background:linear-gradient(180deg,#4A90D9,#3A7BC8);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    color:#fff;
  }
  .status-left { display:flex; align-items:center; gap:6px; }
  .date-num { font-size:22px; font-weight:800; }
  .date-info { font-size:12px; opacity:0.85; line-height:1.3; }
  .status-right { font-size:12px; opacity:0.85; }

  .progress-bar-wrap { background:#E8EEF4; padding:10px 16px 12px; }
  .progress-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .progress-label { font-size:14px; font-weight:600; color:#1a1a1a; }
  .progress-percent { font-size:13px; color:#4A90D9; font-weight:700; }
  .progress-track { height:8px; background:#D0D8E0; border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; width:60%; background:linear-gradient(90deg,#4A90D9,#5BA0E6); border-radius:4px; }

  .plan-list { padding:4px 0 80px; }
  .plan-section-title { font-size:12px; color:#999; padding:10px 16px 4px; font-weight:500; }

  .plan-card {
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:0.5px solid #f0f0f0;
  }
  .plan-icon {
    width:36px; height:36px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .plan-info { flex:1; min-width:0; }
  .plan-name { font-size:15px; font-weight:500; color:#1a1a1a; margin-bottom:2px; }
  .plan-desc { font-size:12px; color:#999; }

  .checkin-area {
    flex-shrink:0; width:80px;
    display:flex; align-items:center; justify-content:center;
  }

  .btn-checkin {
    height:40px; min-width:76px; padding:0 14px;
    background:linear-gradient(180deg,#5BA0E6 0%,#4A90D9 50%,#3A7BC8 100%);
    color:#fff; font-size:13px; font-weight:700;
    border:none; border-radius:20px;
    box-shadow:0 3px 8px rgba(74,144,217,0.3), 0 2px 0 #2E68A8;
    display:inline-flex; align-items:center; gap:4px;
    animation:breath 2.5s ease-in-out infinite;
  }
  @keyframes breath {
    0%,100% { box-shadow:0 3px 8px rgba(74,144,217,0.3), 0 2px 0 #2E68A8, 0 0 0 0 rgba(74,144,217,0.15); }
    50% { box-shadow:0 3px 8px rgba(74,144,217,0.3), 0 2px 0 #2E68A8, 0 0 0 6px rgba(74,144,217,0); }
  }

  .stamp {
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
    animation:stamp-pop 500ms cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes stamp-pop {
    0% { transform:scale(0) rotate(-20deg); opacity:0; }
    50% { transform:scale(1.25) rotate(8deg); opacity:1; }
    70% { transform:scale(0.9) rotate(-3deg); }
    100% { opacity:0.88; }
  }
  .stamp svg { width:38px; height:38px; }
  .stamp:active { transform:scale(0.85); }

  .divider { height:0.5px; background:#f0f0f0; margin:0 16px; }

  .tabbar {
    position:fixed; bottom:0; left:0; right:0; max-width:375px; margin:0 auto;
    height:calc(50px + env(safe-area-inset-bottom));
    background:#fff; border-top:0.5px solid #e0e0e0;
    display:flex; align-items:flex-start; padding-top:6px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:10px; color:#999;
  }
  .tab-item.active { color:#4A90D9; }
  .tab-icon { font-size:20px; }
</style>
</head>
<body>
<div class="phone-frame">

  <div class="status-bar">
    <div class="status-left">
      <span class="date-num">24</span>
      <div class="date-info">
        <div>七月 周四</div>
        <div>第 30 周</div>
      </div>
    </div>
    <div class="status-right">🔥 连续 12 天</div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-row">
      <span class="progress-label">今日打卡</span>
      <span class="progress-percent">3/5 已完成</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="plan-list">

    <div class="plan-section-title">每日习惯</div>

    <!-- 已完成 - 圆形红色印章 -->
    <div class="plan-card">
      <div class="plan-icon" style="background:#FFF3E0;">📖</div>
      <div class="plan-info">
        <div class="plan-name">晨间阅读 30 分钟</div>
        <div class="plan-desc">已完成 · 06:30</div>
      </div>
      <div class="checkin-area">
        <div class="stamp" style="transform:rotate(-6deg); opacity:0.88;">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" fill="none" stroke="#E53935" stroke-width="2.5"/>
            <circle cx="24" cy="24" r="17" fill="none" stroke="#E53935" stroke-width="0.8" stroke-dasharray="1.5,1.5"/>
            <circle cx="24" cy="24" r="14" fill="none" stroke="#E53935" stroke-width="1"/>
            <text x="24" y="22" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#E53935" style="font-family:'PingFang SC',sans-serif;">已打卡</text>
            <text x="24" y="31" text-anchor="middle" font-size="3.5" fill="#E53935">★ ★ ★</text>
          </svg>
        </div>
      </div>
    </div>

    <!-- 补卡 - 圆形橙色印章 -->
    <div class="plan-card">
      <div class="plan-icon" style="background:#E8F5E9;">🏃</div>
      <div class="plan-info">
        <div class="plan-name">运动 20 分钟</div>
        <div class="plan-desc" style="color:#FF8F00;">补卡 · 07/22 补打</div>
      </div>
      <div class="checkin-area">
        <div class="stamp" style="transform:rotate(5deg); opacity:0.88;">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" fill="none" stroke="#FF8F00" stroke-width="2.5"/>
            <circle cx="24" cy="24" r="17" fill="none" stroke="#FF8F00" stroke-width="0.8" stroke-dasharray="1.5,1.5"/>
            <circle cx="24" cy="24" r="14" fill="none" stroke="#FF8F00" stroke-width="1"/>
            <text x="24" y="22" text-anchor="middle" font-size="5" font-weight="bold" fill="#FF8F00" style="font-family:'PingFang SC',sans-serif;">已补卡</text>
            <text x="24" y="31" text-anchor="middle" font-size="3.5" fill="#FF8F00">补 · ★</text>
          </svg>
        </div>
      </div>
    </div>

    <!-- 已完成 - 方形红色印章 -->
    <div class="plan-card">
      <div class="plan-icon" style="background:#E3F2FD;">✍️</div>
      <div class="plan-info">
        <div class="plan-name">背英语单词 20 个</div>
        <div class="plan-desc">已完成 · 07:15</div>
      </div>
      <div class="checkin-area">
        <div class="stamp" style="transform:rotate(-3deg); opacity:0.88;">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="3" y="3" width="42" height="42" rx="3" fill="none" stroke="#E53935" stroke-width="2.5"/>
            <rect x="7" y="7" width="34" height="34" rx="2" fill="none" stroke="#E53935" stroke-width="1"/>
            <text x="24" y="26" text-anchor="middle" font-size="7" font-weight="bold" fill="#E53935" style="font-family:'PingFang SC',sans-serif;">已打卡</text>
            <line x1="14" y1="32" x2="34" y2="32" stroke="#E53935" stroke-width="0.8"/>
            <text x="24" y="38" text-anchor="middle" font-size="3.5" fill="#E53935" letter-spacing="0.8">CHECKED</text>
          </svg>
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="plan-section-title">学习任务</div>

    <!-- 未完成 -->
    <div class="plan-card">
      <div class="plan-icon" style="background:#FFF9C4;">📝</div>
      <div class="plan-info">
        <div class="plan-name">数学口算 100 题</div>
        <div class="plan-desc">预计 15 分钟</div>
      </div>
      <div class="checkin-area">
        <button class="btn-checkin">打卡</button>
      </div>
    </div>

    <!-- 未完成 -->
    <div class="plan-card">
      <div class="plan-icon" style="background:#F3E5F5;">🎵</div>
      <div class="plan-info">
        <div class="plan-name">钢琴练习</div>
        <div class="plan-desc">预计 30 分钟</div>
      </div>
      <div class="checkin-area">
        <button class="btn-checkin">打卡</button>
      </div>
    </div>

  </div>

  <div class="tabbar">
    <div class="tab-item active">
      <span class="tab-icon">🏠</span><span>首页</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">📊</span><span>统计</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">📅</span><span>日历</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">👤</span><span>我的</span>
    </div>
  </div>

</div>
</body>
</html>
